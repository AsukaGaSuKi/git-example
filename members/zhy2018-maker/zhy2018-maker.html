<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>zhy2018-maker · 个人介绍</title>
  <script>
    (function () {
      var key = "zhy2018-maker-theme";
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = prefersDark ? "dark" : "light";

      try {
        var saved = window.localStorage.getItem(key);
        if (saved === "light" || saved === "dark") {
          theme = saved;
        }
      } catch (error) {
        // 某些浏览器在本地文件中会禁用本地存储。
      }

      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --font-sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
      --page-width: 1120px;
      --radius-large: 30px;
      --radius-medium: 20px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --theme-duration: 240ms;

      --bg: #f3f0e7;
      --surface: #fffdf8;
      --surface-raised: #f8f5ed;
      --surface-soft: #e9e5d9;
      --text: #19251f;
      --muted: #5d6b64;
      --faint: #637168;
      --accent: #096b56;
      --accent-strong: #064f40;
      --accent-soft: #d9ede5;
      --accent-ink: #ffffff;
      --border: #d9d4c6;
      --border-strong: #c4beb0;
      --shadow: 0 28px 80px rgba(39, 53, 45, 0.12);
      --glow-one: rgba(45, 143, 116, 0.13);
      --glow-two: rgba(211, 155, 71, 0.13);
      --dot: rgba(25, 37, 31, 0.16);
      --number-watermark: rgba(9, 107, 86, 0.055);
    }

    html[data-theme="dark"] {
      --bg: #0d1411;
      --surface: #14201b;
      --surface-raised: #192820;
      --surface-soft: #1c2e26;
      --text: #f0f4ee;
      --muted: #aabbb3;
      --faint: #8fa198;
      --accent: #83dbc0;
      --accent-strong: #a4e9d4;
      --accent-soft: #1d3b31;
      --accent-ink: #0c1713;
      --border: #2b3d35;
      --border-strong: #3b5047;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.36);
      --glow-one: rgba(73, 190, 156, 0.12);
      --glow-two: rgba(209, 150, 68, 0.08);
      --dot: rgba(240, 244, 238, 0.13);
      --number-watermark: rgba(131, 219, 192, 0.07);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color var(--theme-duration) ease, color var(--theme-duration) ease;
    }

    body::before {
      position: fixed;
      z-index: -2;
      inset: 0;
      background:
        radial-gradient(circle at 8% 4%, var(--glow-one), transparent 36rem),
        radial-gradient(circle at 94% 94%, var(--glow-two), transparent 38rem);
      content: "";
      pointer-events: none;
    }

    body::after {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 24px 24px;
      content: "";
      opacity: 0.19;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 72%);
      mask-image: linear-gradient(to bottom, #000 0%, transparent 72%);
    }

    ::selection {
      color: var(--accent-ink);
      background: var(--accent);
    }

    a {
      color: inherit;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 12px;
      padding: 10px 16px;
      color: var(--accent-ink);
      background: var(--accent);
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform 160ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .page {
      width: min(var(--page-width), calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(20px, 3vw, 34px) 0 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: clamp(22px, 3.5vw, 38px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 0 5px var(--accent-soft);
      transform: rotate(45deg);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 9px 15px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(22, 38, 30, 0.06);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      transition:
        color 180ms ease,
        background-color 180ms ease,
        border-color 180ms ease,
        transform 180ms ease;
    }

    .theme-toggle:hover {
      color: var(--accent-strong);
      background: var(--surface-raised);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .theme-toggle:active {
      transform: translateY(0);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .theme-icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .theme-icon--sun {
      display: none;
    }

    html[data-theme="dark"] .theme-icon--sun {
      display: block;
    }

    html[data-theme="dark"] .theme-icon--moon {
      display: none;
    }

    .profile {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
      transition:
        background-color var(--theme-duration) ease,
        border-color var(--theme-duration) ease,
        box-shadow var(--theme-duration) ease;
    }

    @supports not (background: color-mix(in srgb, white 50%, black)) {
      .panel {
        background: var(--surface);
      }
    }

    .identity {
      display: flex;
      flex-direction: column;
      min-height: 590px;
      padding: clamp(26px, 4.2vw, 50px);
      background:
        linear-gradient(145deg, var(--accent-soft) 0%, transparent 34%),
        var(--surface);
    }

    .identity::before {
      position: absolute;
      top: -180px;
      right: -170px;
      width: 380px;
      height: 380px;
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow:
        0 0 0 42px transparent,
        0 0 0 43px var(--border),
        0 0 0 94px transparent,
        0 0 0 95px var(--border);
      content: "";
      opacity: 0.48;
      pointer-events: none;
    }

    .identity::after {
      position: absolute;
      right: -0.06em;
      bottom: -0.33em;
      color: var(--number-watermark);
      content: "Z";
      font-family: var(--font-display);
      font-size: clamp(14rem, 27vw, 25rem);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .eyebrow,
    .section-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--accent-strong);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      line-height: 1.4;
    }

    .eyebrow::before,
    .section-kicker::before {
      width: 22px;
      height: 1px;
      flex: 0 0 auto;
      background: currentColor;
      content: "";
    }

    .identity-main {
      position: relative;
      z-index: 1;
      margin-top: clamp(42px, 7vw, 82px);
    }

    .avatar {
      display: grid;
      width: 64px;
      height: 64px;
      margin-bottom: 25px;
      place-items: center;
      color: var(--accent-ink);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.2), transparent 52%),
        var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 75%, var(--border));
      border-radius: 21px;
      box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 24%, transparent);
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .name {
      max-width: 100%;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: var(--font-display);
      font-size: clamp(2.05rem, 4vw, 3.45rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }

    .handle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    .handle::before {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 50%;
      content: "";
    }

    .direction {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: clamp(44px, 7vw, 72px);
    }

    .direction-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .direction-value {
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      max-width: 100%;
      margin: 0;
      padding: 13px 18px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--border));
      border-radius: 15px;
      font-size: clamp(1.15rem, 2vw, 1.35rem);
      font-weight: 800;
      line-height: 1.35;
    }

    .direction-dot {
      position: relative;
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .goals-panel {
      display: flex;
      flex-direction: column;
      padding: clamp(26px, 4.2vw, 50px);
    }

    .goals-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: clamp(23px, 3.5vw, 34px);
      border-bottom: 1px solid var(--border);
    }

    .goals-heading {
      margin: 11px 0 0;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .goals-count {
      flex: 0 0 auto;
      padding: 6px 11px;
      color: var(--muted);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    .goal-list {
      display: grid;
      gap: 13px;
      margin: clamp(24px, 3.5vw, 34px) 0 0;
      padding: 0;
      list-style: none;
    }

    .goal-item {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      min-width: 0;
      padding: clamp(19px, 2.8vw, 25px);
      overflow: hidden;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        transform 180ms var(--ease);
    }

    .goal-item::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 72px;
      height: 72px;
      background: linear-gradient(225deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 68%);
      content: "";
      pointer-events: none;
    }

    .goal-item:hover {
      background: var(--surface);
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    .goal-number {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-radius: 14px;
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1;
    }

    .goal-text {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(1.02rem, 1.8vw, 1.15rem);
      font-weight: 700;
      line-height: 1.55;
    }

    .goals-footer {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: auto 0 0;
      padding-top: clamp(28px, 4vw, 42px);
      color: var(--faint);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .goals-footer::before {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 20px 4px 0;
      color: var(--faint);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .page-footer p {
      margin: 0;
    }

    .page-footer-line {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .page-footer-line::before {
      width: 18px;
      height: 1px;
      background: var(--border-strong);
      content: "";
    }

    @media (max-width: 860px) {
      .profile {
        grid-template-columns: minmax(0, 1fr);
      }

      .identity {
        min-height: 0;
      }

      .identity-main {
        margin-top: 42px;
      }

      .direction {
        padding-top: 42px;
      }

      .goals-footer {
        margin-top: 0;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(var(--page-width), calc(100% - 24px));
        padding-top: 16px;
      }

      .topbar {
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
      }

      .theme-toggle {
        min-height: 42px;
        padding: 8px 13px;
        font-size: 0.8rem;
      }

      .panel {
        border-radius: 24px;
      }

      .identity,
      .goals-panel {
        padding: 24px;
      }

      .identity::before {
        top: -220px;
        right: -235px;
      }

      .avatar {
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        border-radius: 18px;
        font-size: 1.75rem;
      }

      .name {
        font-size: clamp(1.9rem, 10.5vw, 2.7rem);
      }

      .goals-header {
        gap: 12px;
      }

      .goal-item {
        gap: 14px;
        padding: 18px;
      }

      .goal-number {
        width: 43px;
        height: 43px;
        border-radius: 12px;
      }

      .page-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }
    }

    @media (max-width: 350px) {
      .page {
        width: calc(100% - 18px);
      }

      .identity,
      .goals-panel {
        padding: 20px;
      }

      .theme-toggle {
        padding-inline: 11px;
      }

      .goal-item {
        grid-template-columns: minmax(0, 1fr);
      }

      .goal-number {
        width: 38px;
        height: 38px;
        font-size: 0.98rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="个人档案">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>个人档案</span>
      </div>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换至深色主题">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.3 14.7A8.5 8.5 0 0 1 9.3 3.7 8.6 8.6 0 1 0 20.3 14.7Z"></path>
        </svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.7"></circle>
          <path d="M12 2.3v2M12 19.7v2M4.1 4.1l1.4 1.4M18.5 18.5l1.4 1.4M2.3 12h2M19.7 12h2M4.1 19.9l1.4-1.4M18.5 5.5l1.4-1.4"></path>
        </svg>
        <span id="theme-label">切换至深色</span>
      </button>
    </header>

    <main class="profile" id="main-content">
      <section class="panel identity" aria-labelledby="profile-name">
        <p class="eyebrow">学习者档案</p>

        <div class="identity-main">
          <div class="avatar" aria-hidden="true">Z</div>
          <h1 class="name" id="profile-name">zhy2018-maker</h1>
          <p class="handle">用户名</p>
        </div>

        <div class="direction">
          <p class="direction-label">学习方向</p>
          <p class="direction-value">
            <span class="direction-dot" aria-hidden="true"></span>
            <span>正在探索</span>
          </p>
        </div>
      </section>

      <section class="panel goals-panel" aria-labelledby="goals-heading">
        <header class="goals-header">
          <div>
            <p class="section-kicker">学习目标</p>
            <h2 class="goals-heading" id="goals-heading">两条学习目标</h2>
          </div>
          <span class="goals-count" aria-label="共两项">2 项</span>
        </header>

        <ol class="goal-list">
          <li class="goal-item">
            <span class="goal-number" aria-hidden="true">01</span>
            <p class="goal-text">学会使用 Git 管理改动</p>
          </li>
          <li class="goal-item">
            <span class="goal-number" aria-hidden="true">02</span>
            <p class="goal-text">学会通过 PR 参与协作</p>
          </li>
        </ol>

        <p class="goals-footer">内容整理自个人介绍文件，未添加额外经历信息。</p>
      </section>
    </main>

    <footer class="page-footer">
      <p class="page-footer-line">内容依据介绍文件整理</p>
      <p>个人介绍 · zhy2018-maker</p>
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");
      var label = document.getElementById("theme-label");
      var storageKey = "zhy2018-maker-theme";
      var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      if (!toggle || !label) {
        return;
      }

      function readSavedTheme() {
        try {
          var saved = window.localStorage.getItem(storageKey);
          return saved === "light" || saved === "dark" ? saved : null;
        } catch (error) {
          return null;
        }
      }

      function preferredTheme() {
        var saved = readSavedTheme();
        if (saved) {
          return saved;
        }
        return media && media.matches ? "dark" : "light";
      }

      function applyTheme(theme, persist) {
        var isDark = theme === "dark";
        root.setAttribute("data-theme", theme);
        label.textContent = isDark ? "切换至浅色" : "切换至深色";
        toggle.setAttribute("aria-label", isDark ? "切换至浅色主题" : "切换至深色主题");
        toggle.setAttribute("title", isDark ? "切换至浅色主题" : "切换至深色主题");

        if (persist) {
          try {
            window.localStorage.setItem(storageKey, theme);
          } catch (error) {
            // 存储不可用时，本次切换仍然有效。
          }
        }
      }

      applyTheme(preferredTheme(), false);

      toggle.addEventListener("click", function () {
        var nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(nextTheme, true);
      });

      if (media) {
        var handleSystemThemeChange = function (event) {
          if (!readSavedTheme()) {
            applyTheme(event.matches ? "dark" : "light", false);
          }
        };

        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", handleSystemThemeChange);
        } else if (typeof media.addListener === "function") {
          media.addListener(handleSystemThemeChange);
        }
      }
    })();
  </script>
